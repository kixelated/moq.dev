name: pr

on:
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # Read the Bun version from package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test

      # Social cards are assembled in the layout from post frontmatter, so the
      # built HTML is the only place a broken one shows up. Neither biome nor
      # tsc nor the build itself can tell that a cover is an unrenderable format.
      - run: bun astro build --mode live
      - run: bun scripts/check-og.ts

  toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      # Evaluating the shell checks the Nix, package.json, and Docker Bun pins.
      - run: nix eval --raw .#devShells.x86_64-linux.default.drvPath
